name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No install step on purpose. The analytic modules have no third party
      # dependencies, and this job proves it on a clean runner.
      - name: unit tests
        run: node --test tests/*.test.mjs
